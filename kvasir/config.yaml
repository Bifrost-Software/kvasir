name: "Kvasir"
version: "0.1.0"
slug: "kvasir"
description: "MCP server that exposes Home Assistant's pending updates (list / install / skip) as tools for Claude Code"
url: "https://github.com/Bifrost-Software/kvasir"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
homeassistant_api: true
hassio_api: true
ports:
  8321/tcp: 8321
ports_description:
  8321/tcp: "MCP SSE endpoint (Authorization: Bearer <api_key>)"
options:
  api_key: ""
  log_level: "info"
schema:
  api_key: str
  log_level: "list(debug|info|warning|error)?"
